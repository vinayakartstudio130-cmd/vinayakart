services:
  - type: web
    name: vinayakart
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Set these in the Render dashboard — do NOT commit real values here
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

      # Set to your Vercel frontend URL, e.g. https://vinayakart.vercel.app
      # Multiple origins: https://vinayakart.vercel.app,https://yourdomain.com
      - key: CLIENT_ORIGIN
        sync: false
